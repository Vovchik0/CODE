name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # PyQt не нужен: движок, протокол, статус и веб-сервер работают на
          # стандартной библиотеке. Тесты не затрагивают Qt-GUI.

      - name: Byte-compile all modules
        run: python -m py_compile web_server.py main.py mc_load_tester/*.py

      - name: Run test suite
        run: pytest -q
